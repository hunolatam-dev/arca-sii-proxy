[build]
  functions = "netlify/functions"
  publish   = "public"

# Redirect /api/sii/* to the function (sin :splat — la función lee event.rawUrl)
[[redirects]]
  from   = "/api/sii/*"
  to     = "/.netlify/functions/sii"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
